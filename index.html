<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedShelf</title>
  <meta name="description" content="Free medicine stock and expiry tracker for small pharmacies and clinics. Works offline; your data stays on your device.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/dashboard"><img src="icons/icon.svg" alt="" width="28" height="28"><span>MedShelf</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-view="dashboard">Today</a>
      <a href="#/stock" data-view="stock">Stock</a>
      <a href="#/receive" data-view="receive">Receive</a>
      <a href="#/dispense" data-view="dispense">Dispense</a>
      <a href="#/data" data-view="data">Data</a>
    </nav>
  </header>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  <div id="toast" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="notice bad">MedShelf needs JavaScript turned on.</p></noscript>
</body>
</html>
